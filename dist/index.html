<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>짤만들기</title><meta name="description" content="이미지에 텍스트와 효과를 추가하고 PNG로 저장합니다."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23cefa59'/%3E%3Ctext x='5' y='24' font-size='23'%3E짤%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./"><span>짤</span> 짤만들기</a><button id="download" class="primary">↓ PNG 저장</button></header>
<main>
<div class="workspace"><aside class="panel"><section><h2><b>01</b> 배경 고르기</h2><label class="upload" id="dropzone"><input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><strong>＋ 내 이미지 불러오기</strong><span>클릭하거나 사진을 끌어다 놓으세요</span><small>JPG · PNG · WebP · GIF / 최대 20MB</small></label><div class="presets" id="presets"><button data-bg="mint" class="swatch mint active" aria-label="라임 배경" aria-pressed="true"></button><button data-bg="purple" class="swatch purple" aria-label="보라 배경" aria-pressed="false"></button><button data-bg="blue" class="swatch blue" aria-label="파랑 배경" aria-pressed="false"></button><button data-bg="white" class="swatch white" aria-label="흰 배경" aria-pressed="false"></button></div><p class="library-label">내 이미지 <small>이 브라우저에 저장 · 최대 12장</small></p><div id="images" class="presets"></div></section>
<section><h2><b>02</b> 문구 넣기 <button class="text-button" id="add">＋ 문구 추가</button></h2><div id="layers" class="layers"></div><label for="text">선택한 문구</label><textarea id="text" maxlength="240" rows="3"></textarea><div class="row"><label>글꼴<select id="font"><option value="sans-serif">고딕</option><option value="serif">명조</option><option value="monospace">고정폭</option></select></label><label>글자색<input type="color" id="color" value="#ffffff"></label></div><label class="range-label" for="size">글씨 크기 <output id="size-out"></output></label><input id="size" type="range" min="16" max="140"><div class="row options"><label><input id="outline" type="checkbox" checked> 검정 테두리</label><button id="delete" class="text-button">문구 삭제</button></div></section>
<section><h2><b>03</b> 효과</h2><div class="effects" id="effects"><button data-effect="none" class="active" aria-pressed="true">원본</button><button data-effect="mono" aria-pressed="false">흑백</button><button data-effect="warm" aria-pressed="false">레트로</button><button data-effect="punch" aria-pressed="false">고채도</button></div><label class="options"><input id="speed" type="checkbox"> 집중선 추가</label></section></aside>
<section class="preview-panel"><div class="preview-heading"><span><i></i> 실시간 미리보기</span><button class="text-button" id="reset">↺ 처음부터</button></div><div class="stage"><canvas id="canvas" width="900" height="900" aria-label="문구가 합성된 짤 미리보기"></canvas></div><div class="preview-footer"><span id="dimensions">900 × 900 px</span><span>드래그로 문구 이동</span></div><p class="privacy">이미지는 이 브라우저에 저장됩니다. 브라우저 데이터 삭제 시 사라질 수 있습니다. 문구와 효과는 새로고침하면 초기화됩니다.</p><p id="status" role="status" aria-live="polite"></p><div id="saved"></div></section></div></main><script src="image-store.js"></script><script src="app.js"></script></body></html>
